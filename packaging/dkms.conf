# dkms.conf — source-rebuild (DKMS) delivery for sch_cake.
#
# This is the FALLBACK to the prebuilt kmod RPM (packaging/kmod-sch_cake.spec).
# Use when you prefer auto-rebuild on kernel updates over a pinned binary.
#
# Deploy:
#   VER=$(git rev-parse --short HEAD)
#   cp -a . /usr/src/sch_cake-$VER      # this tree, including this dkms.conf
#   dkms add    -m sch_cake -v $VER
#   dkms build  -m sch_cake -v $VER
#   dkms install -m sch_cake -v $VER
#
# The repo Makefile builds sch_cake.ko out-of-tree against
# /lib/modules/<kver>/build; the MAKE line below drives that same build inside
# the DKMS build tree.

PACKAGE_NAME="sch_cake"
PACKAGE_VERSION="__VER__"
BUILT_MODULE_NAME[0]="sch_cake"
DEST_MODULE_LOCATION[0]="/kernel/net/sched"
MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/sch_cake/${PACKAGE_VERSION}/build modules"
CLEAN="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/sch_cake/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
